<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderLuxe – Luxury Travel Redefined</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--p1:#8b5cf6;--p2:#7c3aed;--p3:#6d28d9;--sec:#ec4899;--gold:#fbbf24;--emerald:#10b981;--bg:#fafaf9;--bg2:#f3f0ff;--bg3:#ede9fe;--card:#ffffff;--card2:#f8f7ff;--text:#12101e;--text2:#3d3660;--text3:#7c72a8;--border:#e4dfff;--border2:#d1c9ff;--nav-bg:rgba(250,250,249,0.94);--shadow:rgba(139,92,246,0.12);--shadow2:rgba(139,92,246,0.22);--modal-bg:rgba(18,16,30,0.72);--t:all 0.28s cubic-bezier(.4,0,.2,1);}
[data-theme=dark]{--bg:#0c0a1e;--bg2:#130f2a;--bg3:#1c1638;--card:#181430;--card2:#201b3a;--text:#f0ecff;--text2:#c4bbf0;--text3:#7e73b8;--border:#2a2250;--border2:#362d6a;--nav-bg:rgba(12,10,30,0.96);--shadow:rgba(139,92,246,0.2);--shadow2:rgba(139,92,246,0.35);--modal-bg:rgba(6,4,18,0.82);}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--p1);border-radius:3px;}
img{display:block;}button{font-family:'Poppins',sans-serif;cursor:pointer;}input,select,textarea{font-family:'Poppins',sans-serif;}

/* LAYOUT */
.page{padding-top:68px;min-height:100vh;}.container{max-width:1180px;margin:0 auto;padding:0 1.5rem;}.section{padding:4.5rem 0;}.section-alt{background:var(--bg2);}

/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;height:68px;z-index:900;background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;box-shadow:0 2px 24px var(--shadow);}
.nav-logo{display:flex;align-items:center;gap:.45rem;cursor:pointer;text-decoration:none;flex-shrink:0;}
.nav-logo-icon{font-size:1.3rem;}
.nav-logo-text{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;gap:.1rem;flex:1;justify-content:center;}
.nav-link{padding:.42rem .85rem;border-radius:8px;border:none;background:none;font-size:.82rem;font-weight:500;color:var(--text3);transition:var(--t);white-space:nowrap;}
.nav-link:hover{background:var(--bg3);color:var(--p1);}.nav-link.active{background:var(--bg3);color:var(--p1);font-weight:700;}
.nav-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.user-pill{display:flex;align-items:center;gap:.5rem;padding:.32rem .85rem;background:var(--bg3);border-radius:20px;font-size:.8rem;font-weight:600;color:var(--p1);}
.user-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--sec));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:var(--t);flex-shrink:0;}
.icon-btn:hover{border-color:var(--p1);transform:rotate(20deg) scale(1.08);}
.logout-btn{padding:.35rem .9rem;border-radius:8px;border:1.5px solid var(--border);background:none;font-size:.78rem;font-weight:600;color:var(--text3);transition:var(--t);}
.logout-btn:hover{border-color:#f43f5e;color:#f43f5e;}
.ham{display:none;flex-direction:column;gap:4px;padding:.45rem;background:none;border:none;}
.ham span{width:21px;height:2px;background:var(--text);border-radius:2px;transition:var(--t);display:block;}
.mob-menu{display:none;position:fixed;top:68px;left:0;right:0;background:var(--nav-bg);border-bottom:1px solid var(--border);backdrop-filter:blur(18px);padding:1rem 1.5rem;z-index:899;flex-direction:column;gap:.4rem;}
.mob-menu.open{display:flex;}

/* BUTTONS */
.btn{padding:.65rem 1.5rem;border-radius:10px;border:none;font-size:.88rem;font-weight:700;transition:var(--t);display:inline-flex;align-items:center;gap:.4rem;}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 4px 18px rgba(139,92,246,.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(139,92,246,.42);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-outline{background:none;border:1.5px solid var(--border2);color:var(--text2);}
.btn-outline:hover{border-color:var(--p1);color:var(--p1);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#1a1000;}
.btn-sm{padding:.4rem 1rem;font-size:.78rem;border-radius:8px;}

/* SECTION */
.sec-tag{display:inline-block;padding:.28rem .9rem;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(236,72,153,.1));border:1px solid rgba(139,92,246,.22);border-radius:20px;color:var(--p1);font-size:.7rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:.7rem;}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.9rem,4vw,2.9rem);font-weight:700;color:var(--text);line-height:1.2;margin-bottom:.65rem;}
.sec-sub{color:var(--text3);font-size:.93rem;line-height:1.75;max-width:520px;}
.sec-header{text-align:center;margin-bottom:2.8rem;}.sec-header .sec-sub{margin:0 auto;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0c0a1e 0%,#1c1538 50%,#2d1b69 100%);position:relative;overflow:hidden;padding:1rem;}
.login-orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;}
.login-card{background:rgba(255,255,255,.055);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:2.5rem 2.2rem;width:100%;max-width:440px;position:relative;z-index:1;animation:fadeUp .5s ease;}
.login-logo{text-align:center;margin-bottom:1.8rem;}
.login-logo-icon{font-size:2.8rem;line-height:1;}
.login-logo h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:.3rem 0 .2rem;}
.login-logo p{color:rgba(255,255,255,.45);font-size:.82rem;}
.fl{margin-bottom:1.1rem;}
.fl label{display:block;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:.4rem;}
.fl input{width:100%;padding:.7rem 1rem;border-radius:11px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);color:#fff;font-size:.9rem;outline:none;transition:var(--t);}
.fl input:focus{border-color:var(--p1);background:rgba(139,92,246,.1);}
.fl input::placeholder{color:rgba(255,255,255,.28);}
.fl input:disabled{opacity:.5;}
.login-btn{width:100%;padding:.82rem;border-radius:12px;border:none;background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;font-size:.97rem;font-weight:700;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:.5rem;}
.login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(139,92,246,.5);}
.login-btn:disabled{opacity:.7;cursor:not-allowed;}
.err{color:#f87171;font-size:.77rem;margin-top:.3rem;}
.hint-box{margin-top:1.4rem;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.22);border-radius:12px;padding:.9rem 1rem;}
.hint-box p{color:rgba(251,191,36,.9);font-size:.78rem;line-height:1.6;}

/* API STATUS BANNER */
.api-banner{position:fixed;bottom:1.2rem;right:1.2rem;z-index:9999;display:flex;align-items:center;gap:.5rem;padding:.45rem 1rem;border-radius:20px;font-size:.75rem;font-weight:700;backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,.2);animation:fadeUp .4s ease;}
.api-banner.online{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#10b981;}
.api-banner.offline{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:var(--p1);}

/* API TOAST */
.toast-wrap{position:fixed;top:80px;right:1.2rem;z-index:9998;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;}
.toast{padding:.7rem 1.1rem;border-radius:12px;font-size:.8rem;font-weight:600;backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,.15);animation:slideIn .3s ease;display:flex;align-items:center;gap:.5rem;pointer-events:none;max-width:320px;}
.toast.success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10b981;}
.toast.error{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.25);color:#f43f5e;}
.toast.info{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:var(--p1);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* API REQUEST LOG */
.api-log{position:fixed;bottom:1.2rem;left:1.2rem;z-index:9997;width:320px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 32px var(--shadow2);font-size:.72rem;overflow:hidden;transition:var(--t);}
.api-log-hdr{display:flex;align-items:center;justify-content:space-between;padding:.55rem .9rem;background:var(--bg3);border-bottom:1px solid var(--border);cursor:pointer;}
.api-log-title{font-weight:700;color:var(--p1);font-size:.75rem;display:flex;align-items:center;gap:.4rem;}
.api-log-body{max-height:180px;overflow-y:auto;padding:.5rem;}
.api-log-entry{display:flex;align-items:flex-start;gap:.5rem;padding:.35rem .4rem;border-radius:6px;margin-bottom:.2rem;}
.api-log-entry:last-child{margin:0;}
.api-log-entry.req{background:rgba(139,92,246,.06);}
.api-log-entry.res{background:rgba(16,185,129,.06);}
.api-log-entry.err{background:rgba(244,63,94,.06);}
.log-method{font-weight:800;font-size:.68rem;padding:.1rem .38rem;border-radius:4px;flex-shrink:0;}
.log-method.GET{background:rgba(16,185,129,.15);color:#10b981;}
.log-method.POST{background:rgba(139,92,246,.15);color:var(--p1);}
.log-method.PUT{background:rgba(251,191,36,.15);color:#d97706;}
.log-method.DELETE{background:rgba(244,63,94,.12);color:#f43f5e;}
.log-method.PATCH{background:rgba(59,130,246,.12);color:#3b82f6;}
.log-path{color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-status{font-weight:700;margin-left:auto;flex-shrink:0;}
.log-status.ok{color:#10b981;}.log-status.err{color:#f43f5e;}.log-status.pending{color:var(--gold);}
.log-time{color:var(--text3);font-size:.66rem;flex-shrink:0;}

/* JWT BADGE */
.jwt-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .65rem;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);border-radius:20px;font-size:.7rem;font-weight:700;color:var(--p1);}

/* LOADING SKELETON */
.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--border);padding:0;}
.skel-img{height:210px;}.skel-body{padding:1.15rem 1.35rem;}
.skel-line{height:14px;margin-bottom:10px;}
.skel-line.short{width:60%;}

/* HERO */
.hero{min-height:calc(100vh - 68px);background:linear-gradient(140deg,#0c0a1e 0%,#1c1538 45%,#2d1b69 100%);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:3rem 1.5rem;}
.hero-orb{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none;opacity:.22;}
.hero-content{position:relative;z-index:1;max-width:820px;}
.hero-badge{display:inline-flex;align-items:center;gap:.45rem;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.3);border-radius:20px;padding:.38rem 1rem;color:#a78bfa;font-size:.8rem;font-weight:600;margin-bottom:1.6rem;animation:fadeUp .5s ease;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.8rem,7vw,5rem);font-weight:700;color:#fff;line-height:1.12;margin-bottom:1.2rem;animation:fadeUp .6s .1s ease both;}
.hero-title span{background:linear-gradient(135deg,#a78bfa,#ec4899,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{color:rgba(255,255,255,.55);font-size:1.05rem;line-height:1.75;margin-bottom:2.5rem;animation:fadeUp .6s .2s ease both;}
.search-row{display:flex;gap:.65rem;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:.65rem;max-width:580px;margin:0 auto 3rem;backdrop-filter:blur(12px);animation:fadeUp .6s .3s ease both;}
.search-icon{font-size:1.1rem;padding:.2rem .3rem;align-self:center;}
.search-input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:.97rem;padding:.15rem .4rem;}
.search-input::placeholder{color:rgba(255,255,255,.3);}
.stats-row{display:flex;gap:2.5rem;justify-content:center;flex-wrap:wrap;animation:fadeUp .6s .4s ease both;}
.stat .n{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat .l{color:rgba(255,255,255,.45);font-size:.78rem;margin-top:.1rem;}

/* CARDS */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1.6rem;}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.4rem;}
.dest-card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--border);transition:var(--t);cursor:pointer;box-shadow:0 3px 18px var(--shadow);}
.dest-card:hover{transform:translateY(-6px);box-shadow:0 18px 50px var(--shadow2);border-color:var(--border2);}
.card-img{position:relative;height:210px;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.dest-card:hover .card-img img{transform:scale(1.07);}
.card-badge{position:absolute;top:11px;left:11px;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);color:#fff;font-size:.68rem;font-weight:700;padding:.28rem .65rem;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;}
.card-body{padding:1.15rem 1.35rem;}
.card-name{font-size:1.08rem;font-weight:700;color:var(--text);margin-bottom:.3rem;}
.card-desc{font-size:.8rem;color:var(--text3);line-height:1.62;margin-bottom:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-foot{display:flex;align-items:center;justify-content:space-between;}
.rating{font-size:.83rem;font-weight:600;color:var(--gold);}
.price{font-size:.92rem;font-weight:700;color:var(--p1);}

/* DETAIL */
.detail-wrap{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;}
.back-btn{display:inline-flex;align-items:center;gap:.45rem;padding:.52rem 1.1rem;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--text3);font-size:.83rem;font-weight:600;transition:var(--t);margin-bottom:1.8rem;}
.back-btn:hover{border-color:var(--p1);color:var(--p1);}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:.65rem;height:440px;border-radius:20px;overflow:hidden;margin-bottom:2.3rem;}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .4s;cursor:pointer;}
.gallery img:hover{transform:scale(1.04);}
.gallery img:first-child{grid-row:1/3;}
.detail-layout{display:grid;grid-template-columns:1fr 320px;gap:2rem;margin-bottom:3rem;}
.about-title{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:700;color:var(--text);margin:.5rem 0 .9rem;}
.about-text{color:var(--text2);line-height:1.82;font-size:.9rem;margin-bottom:1.4rem;}
.att-title{font-weight:700;font-size:.88rem;color:var(--text);margin-bottom:.65rem;}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;}
.tag{padding:.35rem .8rem;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:.75rem;font-weight:500;color:var(--text2);}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.4rem;box-shadow:0 4px 20px var(--shadow);height:fit-content;}
.info-card h3{font-size:.93rem;font-weight:700;color:var(--text);margin-bottom:1.1rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);}
.irow{display:flex;justify-content:space-between;margin-bottom:.8rem;font-size:.82rem;}
.ilabel{color:var(--text3);font-weight:500;}.ivalue{color:var(--text);font-weight:600;text-align:right;max-width:56%;}
.hotels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:1.4rem;}
.hotel-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:var(--t);box-shadow:0 3px 14px var(--shadow);}
.hotel-card:hover{transform:translateY(-4px);box-shadow:0 14px 38px var(--shadow2);}
.h-imgs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:2px;height:172px;}
.h-imgs img{width:100%;height:100%;object-fit:cover;}
.h-imgs img:first-child{grid-column:1/3;height:104px;}
.h-imgs img:not(:first-child){height:66px;}
.h-body{padding:1rem 1.2rem;}
.h-name{font-size:.97rem;font-weight:700;color:var(--text);margin-bottom:.28rem;}
.h-rating{color:var(--gold);font-size:.8rem;margin-bottom:.55rem;}
.amenities{display:flex;flex-wrap:wrap;gap:.32rem;margin-bottom:.85rem;}
.am{font-size:.68rem;padding:.22rem .58rem;background:var(--bg3);border-radius:20px;color:var(--text3);font-weight:500;}
.h-foot{display:flex;align-items:center;justify-content:space-between;}
.h-price{font-size:.95rem;font-weight:700;color:var(--p1);}
.h-price sub{font-size:.7rem;font-weight:400;color:var(--text3);}

/* BOOKINGS */
.empty-state{text-align:center;padding:5rem 1.5rem;}
.empty-icon{font-size:3.8rem;opacity:.25;margin-bottom:1rem;}
.booking-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.4rem;box-shadow:0 3px 16px var(--shadow);transition:var(--t);}
.booking-card:hover{border-color:var(--border2);}
.bk-id{font-size:.72rem;color:var(--text3);margin-bottom:.38rem;}
.bk-name{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:.22rem;}
.bk-dest{font-size:.82rem;color:var(--p1);font-weight:600;margin-bottom:.9rem;}
.bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.9rem;}
.bk-field .bfl{font-size:.72rem;color:var(--text3);margin-bottom:.12rem;}
.bk-field .bfv{font-size:.82rem;font-weight:600;color:var(--text);}
.bk-total{font-size:.95rem;font-weight:700;color:var(--p1);border-top:1px solid var(--border);padding-top:.7rem;}
.conf-badge{display:inline-flex;align-items:center;gap:.28rem;padding:.22rem .65rem;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22);border-radius:20px;color:var(--emerald);font-size:.72rem;font-weight:700;margin-left:.5rem;}
.pkg-card{background:linear-gradient(135deg,var(--bg2),var(--card));border:1px solid var(--border2);border-radius:18px;padding:1.4rem;box-shadow:0 3px 16px var(--shadow);}
.pkg-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.22rem;}
.pkg-dest{font-size:.82rem;color:var(--sec);font-weight:600;margin-bottom:.8rem;}
.pkg-details{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:.8rem;}
.pkg-field .pfl{font-size:.7rem;color:var(--text3);margin-bottom:.1rem;}
.pkg-field .pfv{font-size:.8rem;font-weight:600;color:var(--text);}
.pkg-cost{font-size:.95rem;font-weight:700;color:var(--sec);border-top:1px solid var(--border);padding-top:.65rem;}
.tabs-row{display:flex;gap:.5rem;margin-bottom:2rem;flex-wrap:wrap;}

function genId(){ return 'WL'+Math.random().toString(36).substring(2,8).toUpperCase(); }

/* ══════════════════ SIMULATED API CALLS ══════════════════════════════════ */
const SimApi = {
  async call(method, path, body=null, showLog=true) {
    const logId = Date.now();
    const start = Date.now();
    if(showLog) addLog({id:logId, method, path, status:'pending', time:'…', ts:new Date().toLocaleTimeString()});
    await randDelay();
    const ms = Date.now()-start;
    if(showLog) addLog({id:logId, method, path, status:'ok', time:`${ms}ms`, ts:new Date().toLocaleTimeString()});
    return ok(body, '', 0);
  },

  async login(username, password) {
    addLog({id:Date.now(),method:'POST',path:'/auth/login',status:'pending',time:'…',ts:new Date().toLocaleTimeString()});
    await randDelay();
    const user = USERS.find(u=>u.u===username&&u.p===password);
    const id = Date.now();
    if(!user){
      addLog({id,method:'POST',path:'/auth/login',status:'err',time:'401',ts:new Date().toLocaleTimeString()});
      return {ok:false,message:'Invalid credentials'};
    }
    const token = JwtSim.generate(username);
    JwtSim.setToken(token);
    addLog({id,method:'POST',path:'/auth/login',status:'ok',time:'201',ts:new Date().toLocaleTimeString()});
    return {ok:true, token, username, userId:user.u==='Keerthi'?1:2};
  },

  async getDestinations(q='',cat='') {
    await this.call('GET', `/destinations${q?`?q=${q}`:cat?`?category=${cat}`:''}`, null);
    let list = [...DEST];
    if(q) list = list.filter(d=>d.name.toLowerCase().includes(q.toLowerCase())||d.cat.toLowerCase().includes(q.toLowerCase())||d.country.toLowerCase().includes(q.toLowerCase()));
    if(cat&&cat!=='All') list = list.filter(d=>d.cat===cat);
    return list;
  },

  async getDestination(id) {
    await this.call('GET',`/destinations/${id}`,null);
    return DEST.find(d=>d.id===id)||null;
  },

  async createBooking(data) {
    await this.call('POST','/bookings',data);
    return {...data, bookingReference: genId(), status:'CONFIRMED', bookedAt: new Date().toISOString()};
  },

  async getBookings() {
    await this.call('GET','/bookings',null);
    return [];
  },

  async cancelBooking(ref) {
    await this.call('PATCH',`/bookings/${ref}/cancel`,null);
    return {bookingReference:ref, status:'CANCELLED'};
  },

  async createPackage(data) {
    await this.call('POST','/packages',data);
    return {...data, packageReference: genId(), status:'CONFIRMED', createdAt: new Date().toISOString()};
  },

  async getGuides(destId=null) {
    await this.call('GET',`/guides${destId?`?destinationId=${destId}`:''}`,null);
    return destId ? ALL_GUIDES.filter(g=>g.destId===destId) : ALL_GUIDES;
  },

  async createMemory(data) {
    await this.call('POST','/vault',data);
    return {...data, id:'m'+Date.now(), createdAt:new Date().toISOString()};
  },

  async updateMemory(id, data) {
    await this.call('PUT',`/vault/${id}`,data);
    return {...data, id, updatedAt:new Date().toISOString()};
  },

  async deleteMemory(id) {
    await this.call('DELETE',`/vault/${id}`,null);
    return true;
  },

  exportVault(mems) {
    addLog({id:Date.now(),method:'GET',path:'/vault/export',status:'ok',time:'200',ts:new Date().toLocaleTimeString()});
    const txt=mems.map(m=>`📍 ${m.loc}\n📅 ${m.date}\n\n${m.text}\n\n${'─'.repeat(50)}`).join('\n\n');
    const blob=new Blob([`WanderLuxe Memory Vault\nExported: ${new Date().toLocaleDateString()}\n${'═'.repeat(50)}\n\n${txt}`],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='WanderLuxe_MemoryVault.txt';a.click();
  }
};

function useToast() {
  const [toasts,setToasts]=useState([]);
  const show = useCallback((msg,type='success')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
  },[]);
  return {toasts,show};
}

}

function ApiLog(){
  const [logs,setLogs]=useState([]);
  const [open,setOpen]=useState(true);
  useEffect(()=>{
    apiLogListeners.push(setLogs);
    return ()=>{ apiLogListeners=apiLogListeners.filter(f=>f!==setLogs); };
  },[]);
  if(!logs.length) return null;
  return(
    <div className="api-log">
      <div className="api-log-hdr" onClick={()=>setOpen(o=>!o)}>
        <div className="api-log-title">⚡ API Requests <span style={{background:'var(--p1)',color:'#fff',borderRadius:20,padding:'0 .45rem',fontSize:'.68rem'}}>{logs.length}</span></div>
        <span style={{color:'var(--text3)',fontSize:'.7rem'}}>{open?'▼':'▲'}</span>
      </div>
      {open&&(
        <div className="api-log-body">
          {logs.map(l=>(
            <div key={l.id+l.ts} className={`api-log-entry ${l.status==='pending'?'req':l.status==='err'?'err':'res'}`}>
              <span className={`log-method ${l.method}`}>{l.method}</span>
              <span className="log-path" title={`${API_BASE}${l.path}`}>{l.path}</span>
              <span className={`log-status ${l.status==='ok'?'ok':l.status==='err'?'err':'pending'}`}>{l.status==='ok'?'200':l.status==='pending'?'…':l.time}</span>
              <span className="log-time">{l.ts}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function LoginPage({onLogin}){

  const [p,setP]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const go=async()=>{
    if(!u.trim()||!p.trim()){setErr('Please enter your username and password.');return;}
    setLoading(true);setErr('');
    const res = await SimApi.login(u,p);
    setLoading(false);
    if(res.ok){ onLogin(u,res.token); }
    else { setErr('Invalid credentials. Please use the demo accounts below.'); }
  };

  return(
    <div className="login-wrap">
      <div className="login-orb" style={{width:500,height:500,background:'#8b5cf6',top:-100,right:-120,opacity:.22}}/>

      <div className="login-card">
        <div className="login-logo">
          <div className="login-logo-icon">👑</div>
          <h1>WanderLuxe</h1>
          <p>Your Luxury Travel Companion</p>
        </div>
        {/* API status */}
        <div style={{textAlign:'center',marginBottom:'1.2rem'}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:'.4rem',padding:'.28rem .85rem',borderRadius:20,fontSize:'.72rem',fontWeight:700,background:'rgba(139,92,246,.15)',border:'1px solid rgba(139,92,246,.3)',color:'#a78bfa'}}>
            ⚡ Spring Boot API · localhost:8080
          </span>
        </div>
        <div className="fl">
          <label>Username</label>
          <input value={u} onChange={e=>setU(e.target.value)} placeholder="Enter username" onKeyDown={e=>e.key==='Enter'&&go()} disabled={loading}/>
        </div>
        <div className="fl">
          <label>Password</label>
          <input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="Enter password" onKeyDown={e=>e.key==='Enter'&&go()} disabled={loading}/>
          {err&&<div className="err">{err}</div>}
        </div>
        <button className="login-btn" onClick={go} disabled={loading}>
          {loading?<><span className="spinner" style={{width:16,height:16,borderWidth:2,margin:0}}/> Authenticating…</>:'Sign In →'}
        </button>
        {/* JWT display after login starts */}
        {loading&&(
          <div style={{marginTop:'1rem',background:'rgba(139,92,246,.08)',border:'1px solid rgba(139,92,246,.2)',borderRadius:10,padding:'.65rem .9rem'}}>
            <div style={{fontSize:'.68rem',color:'rgba(255,255,255,.5)',marginBottom:'.25rem'}}>POST /api/auth/login</div>
            <div style={{fontSize:'.7rem',color:'#a78bfa',wordBreak:'break-all',fontFamily:'monospace'}}>Generating JWT token…</div>

function BookingModal({hotel,onClose,onConfirm}){
  const [step,setStep]=useState(1);
  const [room,setRoom]=useState(hotel.rooms[0]);
  const [form,setForm]=useState({name:'',email:'',phone:'',ci:'',co:'',guests:'2'});
  const [errs,setErrs]=useState({});
  const [bid]=useState(genId);
  const [saving,setSaving]=useState(false);

  const nights=()=>{if(!form.ci||!form.co)return 0;const d=new Date(form.co)-new Date(form.ci);return Math.max(0,Math.floor(d/(86400000)));};
  const total=room.p*Math.max(1,nights());

  const validate=()=>{
    const e={};
    if(!form.name.trim())e.name='Required';
    if(!form.email.includes('@'))e.email='Valid email required';
    if(form.phone.length<7)e.phone='Valid phone required';
    if(!form.ci)e.ci='Required';
    if(!form.co||form.co<=form.ci)e.co='Must be after check-in';
    setErrs(e);return Object.keys(e).length===0;
  };

  const confirm=async()=>{
    if(!validate())return;
    setSaving(true);
    await onConfirm({id:bid,hotel:hotel.name,dest:hotel.destName,...form,room:room.t,total,nights:nights()});
    setSaving(false);
    setStep(3);
  };

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <div className="modal-title">Book {hotel.name}</div>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-steps">
          {['Hotel Details','Booking Form','Confirmation'].map((s,i)=><div key={s} className={`m-step${step===i+1?' active':step>i+1?' done':''}`}>{i+1}. {s}</div>)}
        </div>
        <div className="modal-body">
          {step===1&&(<>
            <div className="m-imgs">{hotel.imgs.map((img,i)=><img key={i} src={img} alt={hotel.name}/>)}</div>
            <strong style={{color:'var(--text)'}}>{hotel.name}</strong>
            <div style={{color:'var(--gold)',margin:'.35rem 0 .7rem',fontSize:'.83rem'}}>{'⭐'.repeat(Math.floor(hotel.rating))} {hotel.rating}</div>
            <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--text)',marginBottom:'.45rem'}}>Amenities</div>
            <div className="amenities" style={{marginBottom:'1rem'}}>{hotel.amenities.map(a=><span key={a} className="am">{a}</span>)}</div>
            <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--text)',marginBottom:'.45rem'}}>Select Room Type</div>
            <div className="room-list">{hotel.rooms.map(r=>(
              <div key={r.t} className={`r-opt${room.t===r.t?' sel':''}`} onClick={()=>setRoom(r)}>
                <div className="r-name">{r.t}</div><div className="r-price">${r.p}/night</div>
              </div>
            ))}</div>
          </>)}
          {step===2&&(<>
            {[['name','Full Name','text','Your full name'],['email','Email','email','your@email.com'],['phone','Phone','tel','+91 98765 43210']].map(([k,lbl,tp,ph])=>(
              <div key={k} className="ff"><label>{lbl}</label><input type={tp} placeholder={ph} value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})}/>{errs[k]&&<div className="err">{errs[k]}</div>}</div>
            ))}
            <div className="form2">
              <div className="ff"><label>Check-in Date</label><input type="date" value={form.ci} min={new Date().toISOString().split('T')[0]} onChange={e=>setForm({...form,ci:e.target.value})}/>{errs.ci&&<div className="err">{errs.ci}</div>}</div>
              <div className="ff"><label>Check-out Date</label><input type="date" value={form.co} min={form.ci||new Date().toISOString().split('T')[0]} onChange={e=>setForm({...form,co:e.target.value})}/>{errs.co&&<div className="err">{errs.co}</div>}</div>
            </div>
            <div className="ff"><label>Guests</label><select value={form.guests} onChange={e=>setForm({...form,guests:e.target.value})}>{[1,2,3,4,5,6].map(n=><option key={n}>{n}</option>)}</select></div>
            <div className="ff"><label>Room Type</label><select value={room.t} onChange={e=>setRoom(hotel.rooms.find(r=>r.t===e.target.value))}>{hotel.rooms.map(r=><option key={r.t}>{r.t}</option>)}</select></div>
            {nights()>0&&<div style={{background:'var(--bg3)',borderRadius:12,padding:'1rem',textAlign:'center',marginTop:'.5rem'}}>
              <div style={{fontSize:'.78rem',color:'var(--text3)',marginBottom:'.2rem'}}>{nights()} night{nights()>1?'s':''} total</div>
              <div style={{fontSize:'1.4rem',fontWeight:800,color:'var(--p1)'}}>${total.toLocaleString()}</div>
            </div>}
            {/* Simulated request preview */}
            <div style={{marginTop:'1rem',background:'var(--bg2)',borderRadius:10,padding:'.8rem',border:'1px solid var(--border)'}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--text3)',marginBottom:'.35rem'}}>POST /api/bookings · Authorization: Bearer JWT</div>
              <div style={{fontSize:'.7rem',color:'var(--text3)',fontFamily:'monospace',lineHeight:1.6}}>
                {`{ hotelId, roomTypeId, checkIn: "${form.ci||'…'}", checkOut: "${form.co||'…'}", guests: ${form.guests} }`}
              </div>
            </div>
          </>)}
          {step===3&&(
            <div className="confirm-ctr">
              <div className="conf-icon">🎉</div>
              <div className="conf-badge" style={{margin:'0 auto .9rem',display:'inline-flex'}}>✓ Confirmed</div>
              <div className="conf-id">Booking Reference: <strong>{bid}</strong></div>
              <div className="conf-hname">{hotel.name}</div>
              <div className="conf-table">
                {[['Guest',form.name],['Email',form.email],['Check-in',form.ci],['Check-out',form.co],['Room',room.t],['Nights',nights()],['Guests',form.guests],['Total','$'+total.toLocaleString()]].map(([l,v])=>(
                  <div key={l} className="ctr"><span className="ct-l">{l}</span><span>{v}</span></div>
                ))}
              </div>
              <p style={{fontSize:'.8rem',color:'var(--text3)'}}>✅ Saved to My Bookings. Check "My Bookings" tab.</p>
            </div>
          )}
        </div>
        <div className="modal-foot">
          {step===1&&<><button className="btn btn-outline" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={()=>setStep(2)}>Continue →</button></>}
          {step===2&&<><button className="btn btn-outline" onClick={()=>setStep(1)}>← Back</button><button className="btn btn-primary" onClick={confirm} disabled={saving}>{saving?<><span className="spinner" style={{width:14,height:14,borderWidth:2,margin:0}}/> Saving…</>:'Confirm Booking'}</button></>}
          {step===3&&<button className="btn btn-primary" style={{width:'100%'}} onClick={onClose}>Done 🎉</button>}
        </div>
      </div>
    </div>
  );
}

  const [ints,setInts]=useState(['Culture','Food']);
  const [flight,setFlight]=useState(FLIGHTS[0]);
  const [vType,setVType]=useState('car');
  const [vehicle,setVehicle]=useState(CARS[0]);
  const [itin,setItin]=useState(null);
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);

  const toggleInt=i=>setInts(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i]);

  const generate=async()=>{
    await SimApi.call('POST','/planner/generate',{destId:dest.id,days,budget,interests:ints});
    const days_arr=[];
    for(let d=1;d<=days;d++){
      days_arr.push({day:d,morn:dest.morn[(d-1)%dest.morn.length],lunch:dest.rest[(d-1)%dest.rest.length],aft:dest.aft[(d-1)%dest.aft.length],cafe:dest.cafe[(d-1)%dest.cafe.length],eve:dest.eve[(d-1)%dest.eve.length]});
    }
    setItin(days_arr);setStep(4);
  };

  const hCost=dest.hotels[0].price*days;
  const vCost=vehicle.price*days;
  const total=flight.price+hCost+vCost;

  const bookTrip=async()=>{
    setSaving(true);
    const res = await SimApi.createPackage({destId:dest.id,dest:dest.name,days,budget,interests:ints,flight:flight.al,vehicle:vehicle.name,hotel:dest.hotels[0].name,total});
    addPackage({id:res.packageReference,dest:dest.name,days,budget,interests:ints,flight:flight.al,vehicle:vehicle.name,hotel:dest.hotels[0].name,total,bookedOn:new Date().toLocaleDateString()});
    setSaving(false);
    setDone(true);
    showToast(`Trip package confirmed! Ref: ${res.packageReference}`,'success');
  };

  return(
    <div className="page">
      <section className="section">
        <div className="container">
          <div className="sec-header">
            <div className="sec-tag">🗺️ SMART PLANNER</div>
            <h2 className="sec-title">Smart Trip Planner</h2>
            <p className="sec-sub">Build your perfect luxury itinerary in four guided steps.</p>
          </div>
          <div className="planner-wrap">
            <div className="prog-bar">
              {['Plan','Flights','Transport','Itinerary'].map((s,i)=>(
                <div key={s} className={`prog-step${step===i+1?' active':step>i+1?' done':''}`}>
                  <div className="prog-dot">{step>i+1?'✓':i+1}</div>
                  <div className="prog-lbl">{s}</div>
                </div>
              ))}
            </div>
            {step===1&&(
              <div className="plan-card fade-in">
                <h2>Plan Your Trip</h2>
                <div className="ff"><label>Choose Destination</label>
                  <select value={dest.id} onChange={e=>setDest(DEST.find(d=>d.id===parseInt(e.target.value)))}>
                    {DEST.map(d=><option key={d.id} value={d.id}>{d.name}, {d.country}</option>)}
                  </select>
                </div>
                <div className="form2">
                  <div className="ff"><label>Duration: {days} days</label><input type="range" min={3} max={14} value={days} onChange={e=>setDays(+e.target.value)} style={{padding:'.2rem 0'}}/></div>
                  <div className="ff"><label>Budget Level</label><select value={budget} onChange={e=>setBudget(e.target.value)}>{['Budget','Mid-Range','Luxury','Ultra-Luxury'].map(b=><option key={b}>{b}</option>)}</select></div>
                </div>
                <div className="ff"><label>Interests</label>
                  <div className="int-grid">{['Adventure','Culture','Food','Nature','Relaxation','Shopping','Nightlife','History'].map(i=>(
                    <div key={i} className={`int-chip${ints.includes(i)?' sel':''}`} onClick={()=>toggleInt(i)}>{i}</div>
                  ))}</div>
                </div>
                <div className="pnav"><div/><button className="btn btn-primary" onClick={()=>setStep(2)}>Choose Flight →</button></div>
              </div>
            )}
            {step===2&&(
              <div className="plan-card fade-in">
                <h2>Choose Your Flight</h2>
                {FLIGHTS.map(f=>(
                  <div key={f.id} className={`opt-card${flight.id===f.id?' sel':''}`} onClick={()=>setFlight(f)}>
                    <div className="opt-radio"/>
                    <div className="opt-info"><div className="opt-name">{f.al}</div><div className="opt-detail">🕐 {f.t} · ⏱ {f.dur} · {f.feat}</div></div>
                    <div className="opt-price">${f.price}</div>
                  </div>
                ))}
                <div className="pnav"><button className="btn btn-outline" onClick={()=>setStep(1)}>← Back</button><button className="btn btn-primary" onClick={()=>setStep(3)}>Choose Transport →</button></div>
              </div>
            )}
            {step===3&&(
              <div className="plan-card fade-in">
                <h2>Choose Transport</h2>
                <div className="tabs-row" style={{marginBottom:'1.1rem'}}>
                  <button className={`tab-btn${vType==='car'?' active':''}`} onClick={()=>{setVType('car');setVehicle(CARS[0]);}}>🚗 Cars ({CARS.length})</button>
                  <button className={`tab-btn${vType==='bike'?' active':''}`} onClick={()=>{setVType('bike');setVehicle(BIKES[0]);}}>🏍️ Two-Wheelers ({BIKES.length})</button>
                </div>
                <div style={{maxHeight:400,overflowY:'auto'}}>
                  {(vType==='car'?CARS:BIKES).map(v=>(
                    <div key={v.id} className={`opt-card${vehicle.id===v.id?' sel':''}`} onClick={()=>setVehicle(v)}>
                      <div className="opt-radio"/>
                      <div className="opt-info"><div className="opt-name">{v.name}</div><div className="opt-detail">{v.type} · {v.feat}</div></div>
                      <div className="opt-price">${v.price}/day</div>
                    </div>
                  ))}
                </div>
                <div className="pnav"><button className="btn btn-outline" onClick={()=>setStep(2)}>← Back</button><button className="btn btn-primary" onClick={generate}>Generate Itinerary →</button></div>
              </div>
            )}
            {step===4&&itin&&(
              <div className="plan-card fade-in">
                {done?(
                  <div style={{textAlign:'center',padding:'2rem 0'}}>
                    <div style={{fontSize:'3rem',marginBottom:'1rem'}}>🎉</div>
                    <h2>Trip Package Confirmed!</h2>
                    <p style={{color:'var(--text3)',margin:'1rem 0 1.5rem'}}>Your {days}-day luxury journey to {dest.name} has been saved. View in My Bookings → Travel Packages.</p>
                    <div className="conf-badge" style={{display:'inline-flex',margin:'0 auto'}}>✓ Package Saved via POST /api/packages</div>
                  </div>
                ):(
                  <>
                    <h2>Your {days}-Day {dest.name} Itinerary</h2>
                    <div className="itin-sum">
                      <div className="sum-card"><div className="sum-lbl">✈️ Flight</div><div className="sum-val">{flight.al}</div></div>
                      <div className="sum-card"><div className="sum-lbl">🚗 Transport</div><div className="sum-val">{vehicle.name}</div></div>
                      <div className="sum-card"><div className="sum-lbl">🏨 Hotel</div><div className="sum-val">{dest.hotels[0].name}</div></div>
                      <div className="sum-card"><div className="sum-lbl">📅 Duration</div><div className="sum-val">{days} Days · {budget}</div></div>
                    </div>
                    <div className="itin-scroll">
                      {itin.map(d=>(
                        <div key={d.day} className="day-block">
                          <div className="day-hdr">Day {d.day} — {dest.name}</div>
                          <div className="t-row"><div className="t-time">8:00 AM</div><div className="t-txt"><strong>Morning:</strong> {d.morn}</div></div>
                          <div className="t-row"><div className="t-time">12:30 PM</div><div className="t-txt"><strong>Lunch at:</strong> {d.lunch}</div></div>
                          <div className="t-row"><div className="t-time">2:00 PM</div><div className="t-txt"><strong>Afternoon:</strong> {d.aft}</div></div>
                          <div className="t-row"><div className="t-time">5:00 PM</div><div className="t-txt"><strong>Café Break:</strong> {d.cafe}</div></div>
                          <div className="t-row"><div className="t-time">7:00 PM</div><div className="t-txt"><strong>Evening:</strong> {d.eve}</div></div>
                        </div>
                      ))}
                    </div>
                    <div className="cost-table">
                      <div style={{fontWeight:700,marginBottom:'.5rem',color:'var(--text)'}}>💰 Trip Cost Summary</div>
                      <div className="cost-row"><span>✈️ {flight.al}</span><span>${flight.price.toLocaleString()}</span></div>
                      <div className="cost-row"><span>🏨 Hotel ({days} nights × ${dest.hotels[0].price})</span><span>${hCost.toLocaleString()}</span></div>
                      <div className="cost-row"><span>🚗 {vehicle.name} ({days} days × ${vehicle.price})</span><span>${vCost.toLocaleString()}</span></div>
                      <div className="cost-row"><span>Total Estimated</span><span>${total.toLocaleString()}</span></div>
                    </div>
                    <div className="pnav">
                      <button className="btn btn-outline" onClick={()=>setStep(3)}>← Modify</button>
                      <button className="btn btn-gold" onClick={bookTrip} disabled={saving}>
                        {saving?<><span className="spinner" style={{width:14,height:14,borderWidth:2,margin:0}}/> Saving to API…</>:'Book Complete Trip 🎉'}
                      </button>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      </section>
    </div>
  );
}

function VaultPage({showToast}){
  const [mems,setMems]=useState([
    {id:'m1',loc:'Santorini, Greece',date:'2024-06-15',text:"Watched the most spectacular sunset from Oia. The sky turned every shade of gold, rose and violet at once. The cicadas, the sea breeze, the cold Assyrtiko wine — some moments are too perfect to be real."},
    {id:'m2',loc:'Kyoto, Japan',date:'2024-04-05',text:"Cherry blossoms on the Philosopher's Walk. The petals fell like pink snow onto the canal. A monk passed without looking up. I understood something about impermanence I'd been reading about for years."}
  ]);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({loc:'',date:'',text:''});
  const [editId,setEditId]=useState(null);
  const [editForm,setEditForm]=useState({});
  const [saving,setSaving]=useState(false);

  const addMem=async()=>{
    if(!form.loc.trim()||!form.text.trim())return;
    setSaving(true);
    const res = await SimApi.createMemory(form);
    setMems(p=>[{id:res.id,...form},...p]);
    setForm({loc:'',date:'',text:''});setShowForm(false);setSaving(false);
    showToast('Memory saved to vault ✨','success');
  };

  const deleteMem=async(id)=>{
    await SimApi.deleteMemory(id);
    setMems(p=>p.filter(m=>m.id!==id));
    showToast('Memory deleted','error');
  };

  const startEdit=mem=>{setEditId(mem.id);setEditForm({loc:mem.loc,date:mem.date,text:mem.text});};

  const saveEdit=async()=>{
    setSaving(true);
    await SimApi.updateMemory(editId,editForm);
    setMems(p=>p.map(m=>m.id===editId?{...m,...editForm}:m));
    setEditId(null);setSaving(false);
    showToast('Memory updated','success');
  };

  const cancelEdit=()=>setEditId(null);

  const exportVault=()=>{
    SimApi.exportVault(mems);
    showToast('Vault exported! Check your downloads.','info');
  };

  return(
    <div className="page">
      <section className="section">
        <div className="container">
          <div className="vault-header">
            <div>
              <div className="sec-tag">🗝️ MEMORY VAULT</div>
              <h2 className="sec-title" style={{marginBottom:'.3rem'}}>Your Travel Memories</h2>
              <p style={{color:'var(--text3)',fontSize:'.88rem'}}>{mems.length} memories · GET /api/vault</p>
            </div>
            <div style={{display:'flex',gap:'.7rem',flexWrap:'wrap',alignItems:'center'}}>
              <button className="btn btn-outline" onClick={exportVault}>📥 Download Vault</button>
              <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>{showForm?'✕ Cancel':'+ Add Memory'}</button>
            </div>
          </div>
          {showForm&&(
            <div className="add-mem-form">
              <h3>✍️ New Memory <span style={{fontSize:'.75rem',fontWeight:400,color:'var(--text3)'}}>· POST /api/vault</span></h3>
              <div className="form3">
                <div><label style={{display:'block',fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:'.4rem'}}>📍 Location</label><input className="vault-input" placeholder="e.g. Bali, Indonesia" value={form.loc} onChange={e=>setForm({...form,loc:e.target.value})}/></div>
                <div><label style={{display:'block',fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:'.4rem'}}>📅 Date</label><input type="date" className="vault-input" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
              </div>
              <textarea className="vault-textarea" placeholder="Write your travel memory here…" value={form.text} onChange={e=>setForm({...form,text:e.target.value})}/>
              <button className="btn btn-primary" onClick={addMem} disabled={saving}>
                {saving?<><span className="spinner" style={{width:14,height:14,borderWidth:2,margin:0}}/> Saving…</>:'Save Memory 💾'}
              </button>
            </div>
          )}
          {mems.length===0?(
            <div className="empty-vault">
              <div className="empty-vault-icon">🗝️</div>
              <p>Your vault is empty. Start adding travel memories!</p>
            </div>
          ):(
            <div className="mem-grid">
              {mems.map(m=>(
                <div key={m.id} className="mem-card fade-in">
                  {editId===m.id?(
                    <>
                      <div style={{fontSize:'.68rem',color:'var(--text3)',marginBottom:'.5rem'}}>PUT /api/vault/{m.id}</div>
                      <div className="form3" style={{marginBottom:'.7rem'}}>
                        <div><label style={{display:'block',fontSize:'.75rem',fontWeight:700,color:'var(--text3)',marginBottom:'.3rem'}}>Location</label><input className="vault-input" style={{fontSize:'.82rem'}} value={editForm.loc} onChange={e=>setEditForm({...editForm,loc:e.target.value})}/></div>
                        <div><label style={{display:'block',fontSize:'.75rem',fontWeight:700,color:'var(--text3)',marginBottom:'.3rem'}}>Date</label><input type="date" className="vault-input" style={{fontSize:'.82rem'}} value={editForm.date} onChange={e=>setEditForm({...editForm,date:e.target.value})}/></div>
                      </div>
                      <textarea className="vault-textarea" style={{fontSize:'.82rem',minHeight:70}} value={editForm.text} onChange={e=>setEditForm({...editForm,text:e.target.value})}/>
                      <div className="mem-actions">
                        <button className="mem-btn" onClick={saveEdit} disabled={saving} style={{background:'var(--p1)',color:'#fff',borderColor:'var(--p1)'}}>
                          {saving?'Saving…':'Save'}
                        </button>
                        <button className="mem-btn" onClick={cancelEdit}>Cancel</button>
                      </div>
                    </>
                  ):(
                    <>
                      <div className="mem-loc">📍 {m.loc}</div>
                      <div className="mem-date">{m.date?new Date(m.date+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}):''}</div>
                      <div className="mem-text">{m.text}</div>
                      <div className="mem-actions">
                        <button className="mem-btn" onClick={()=>startEdit(m)}>✏️ Edit</button>
                        <button className="mem-btn del" onClick={()=>deleteMem(m.id)}>🗑️ Delete</button>
                      </div>
                    </>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      </section>
    </div>
  );
}

/* ══════════════════════════════ APP ═══════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(null);
  const [token,setToken]=useState(null);
  const [page,setPage]=useState('Home');
  const [theme,setTheme]=useState('light');
  const [selDest,setSelDest]=useState(null);
  const [bookings,setBookings]=useState([]);
  const [packages,setPackages]=useState([]);
  const [sq,setSq]=useState('');
  const [mobOpen,setMobOpen]=useState(false);
  const {toasts,show:showToast} = useToast();

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);},[theme]);

  const nav=p=>{setPage(p);setMobOpen(false);window.scrollTo(0,0);};

  const handleLogin=(username,tok)=>{
    setUser(username);
    setToken(tok);
    showToast(`Welcome back, ${username}! 🎉`,'success');
  };

  const handleLogout=()=>{
    JwtSim.clearToken();
    setUser(null);setToken(null);
    setBookings([]);setPackages([]);
    showToast('Logged out successfully','info');
  };

  const addBooking=b=>setBookings(p=>[b,...p]);
  const addPackage=pkg=>setPackages(p=>[pkg,...p]);

  if(!user) return(
    <>
      <Toasts toasts={toasts}/>
      <LoginPage onLogin={handleLogin}/>
    </>
  );

  return(
    <>
      <Navbar user={user} token={token} page={page} setPage={nav} theme={theme} toggleTheme={()=>setTheme(t=>t==='dark'?'light':'dark')} onLogout={handleLogout} mobOpen={mobOpen} setMobOpen={setMobOpen}/>
      {page==='Home'&&<HomePage setPage={nav} setSelDest={setSelDest} sq={sq} setSq={setSq}/>}
      {page==='Destinations'&&<DestPage setPage={nav} setSelDest={setSelDest}/>}
      {page==='Detail'&&selDest&&<DetailPage dest={selDest} setPage={nav} addBooking={addBooking} showToast={showToast}/>}
      {page==='My Bookings'&&<BookingsPage bookings={bookings} packages={packages} setPage={nav}/>}
      {page==='Guides'&&<GuidesPage showToast={showToast}/>}
      {page==='Trip Planner'&&<PlannerPage addPackage={addPackage} showToast={showToast}/>}
      {page==='Memory Vault'&&<VaultPage showToast={showToast}/>}
      <ApiBanner/>
      <ApiLog/>
      <Toasts toasts={toasts}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
